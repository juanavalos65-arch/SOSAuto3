name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Fix Gradle project
        run: |
          echo "Salvando archivos..."
          cp lib/main.dart /tmp/main.dart || true
          cp pubspec.yaml /tmp/pubspec.yaml || true
          cp -r assets /tmp/assets || true
          rm -rf android
          flutter create -t app --platforms=android --project-name sosauto3 --org com.sosauto.app .
          echo "Restaurando archivos..."
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          cp -r /tmp/assets assets || true

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sosauto-apk
          path: build/app/outputs/flutter-apk/app-release.apk
