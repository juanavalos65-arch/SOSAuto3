name: Build AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          
      - name: Regenerate Android and FIX Kotlin Version
        run: |
          echo "--- Antes ---"
          cat pubspec.yaml || cat SOSAuto3/pubspec.yaml || echo "no pubspec"
          # FIX 1: Forzar nombre minúscula en CUALQUIER pubspec.yaml que exista
          sed -i "s/^name: SOSAuto3/name: sosauto3/I" pubspec.yaml || true
          sed -i "s/^name: SOSAuto3/name: sosauto3/I" SOSAuto3/pubspec.yaml || true
          # Si el archivo está dentro de carpeta SOSAuto3, muévelo a raíz
          if [ -f "SOSAuto3/pubspec.yaml" ]; then
            cp -r SOSAuto3/* . || true
            cp SOSAuto3/.github/workflows/build.yml .github/workflows/build.yml || true
            rm -rf SOSAuto3
          fi
          echo "--- Después ---"
          cat pubspec.yaml
          flutter create . --platforms=android --project-name sosauto3 --org com.sosauto.app
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' $MANIFEST
          
      - name: Build AAB
        run: flutter build appbundle --release
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
