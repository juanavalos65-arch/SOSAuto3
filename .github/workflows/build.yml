name: Build AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          
      - name: Regenerate Android and FIX Kotlin Version
        run: |
          # FIX NOMBRE en todos lados
          sed -i "s/^name: SOSAuto3/name: sosauto3/I" pubspec.yaml 2>/dev/null || true
          sed -i "s/^name: SOSAuto3/name: sosauto3/I" SOSAuto3/pubspec.yaml 2>/dev/null || true
          
          # SI EXISTE CARPETA DOBLE, SACAR TODO A RAIZ Y BORRARLA
          if [ -d "SOSAuto3" ] && [ -f "SOSAuto3/pubspec.yaml" ]; then
            echo "Encontré carpeta doble, moviendo a raíz..."
            cp -rf SOSAuto3/* . 2>/dev/null || true
            cp -rf SOSAuto3/.github . 2>/dev/null || true
            rm -rf SOSAuto3
          fi

          echo "Pubspec final:"
          cat pubspec.yaml

          flutter create . --platforms=android --project-name sosauto3 --org com.sosauto.app
          
          # FIX KOTLIN en TODAS las rutas posibles
          echo "Parcheando Kotlin..."
          find . -name "build.gradle" -type f -exec sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" {} \; || true
          find . -name "settings.gradle" -type f -exec sed -i "s/org.jetbrains.kotlin.android\" version \".*\"/org.jetbrains.kotlin.android\" version \"1.9.22\"/" {} \; || true
          
          cat android/build.gradle
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' $MANIFEST
          
      - name: Build AAB
        run: flutter build appbundle --release
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
