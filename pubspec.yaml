import 'package:flutter/material.dart';
import 'package:url_launcher/url_launcher.dart';
import 'package:local_auth/local_auth.dart';

void main() => runApp(const SOSAutoApp());

class SOSAutoApp extends StatelessWidget {
  const SOSAutoApp({super.key});
  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'SOSAuto',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(primarySwatch: Colors.red, useMaterial3: true),
      home: const HomePage(),
    );
  }
}

class HomePage extends StatefulWidget {
  const HomePage({super.key});
  @override
  State<HomePage> createState() => _HomePageState();
}

class _HomePageState extends State<HomePage> {
  final LocalAuthentication auth = LocalAuthentication();
  bool authenticated = false;

  Future<void> checkBio() async {
    try {
      final bool canCheck = await auth.canCheckBiometrics;
      if (canCheck) {
        final bool didAuth = await auth.authenticate(
          localizedReason: 'Desbloquea SOSAuto',
          options: const AuthenticationOptions(biometricOnly: false),
        );
        setState(() => authenticated = didAuth);
      } else {
        setState(() => authenticated = true);
      }
    } catch (e) {
      setState(() => authenticated = true);
    }
  }

  Future<void> pagarWompi() async {
    const String wompiLink = 'https://checkout.wompi.co/p/?public-key=pub_prod_VPOS_3Odu3K';
    final Uri url = Uri.parse(wompiLink);
    if (await canLaunchUrl(url)) {
      await launchUrl(url, mode: LaunchMode.externalApplication);
    }
  }

  @override
  void initState() {
    super.initState();
    checkBio();
  }

  @override
  Widget build(BuildContext context) {
    if (!authenticated) {
      return Scaffold(
        body: Center(
          child: ElevatedButton(
            onPressed: checkBio,
            child: const Text('Desbloquear SOSAuto'),
          ),
        ),
      );
    }
    return Scaffold(
      appBar: AppBar(title: const Text('SOSAuto - Seguridad Vehicular'), backgroundColor: Colors.red),
      body: Center(
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            const Icon(Icons.car_crash, size: 100, color: Colors.red),
            const SizedBox(height: 20),
            const Text('SOSAuto', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold)),
            const Text('Tu seguridad vehicular'),
            const SizedBox(height: 40),
            ElevatedButton.icon(
              style: ElevatedButton.styleFrom(backgroundColor: Colors.red, foregroundColor: Colors.white, padding: const EdgeInsets.all(20)),
              onPressed: pagarWompi,
              icon: const Icon(Icons.credit_card),
              label: const Text('PAGAR CON WOMPI', style: TextStyle(fontSize: 18)),
            ),
            const SizedBox(height: 20),
            ElevatedButton(
              style: ElevatedButton.styleFrom(backgroundColor: Colors.black, foregroundColor: Colors.white),
              onPressed: () {},
              child: const Text('BOTÓN SOS - EMERGENCIA'),
            ),
          ],
        ),
      ),
    );
  }
}
