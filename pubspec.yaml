name: Build SOSAuto
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: cp lib/main.dart /tmp/main.dart.bak
      - run: flutter create . --platforms=android --project-name sosauto3
      - run: mv /tmp/main.dart.bak lib/main.dart
      - run: flutter pub add url_launcher local_auth
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sosauto-apk
          path: build/app/outputs/flutter-apk/app-release.apk
