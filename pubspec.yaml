name: Build SOSAuto
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: cp lib/main.dart /tmp/main.dart.bak
      - run: rm -rf android
      - run: flutter create -t app . --platforms=android --project-name sosauto3
      - run: mv /tmp/main.dart.bak lib/main.dart
      - run: |
          cat > pubspec.yaml <<'EOF'
          name: sosauto3
          description: SOSAuto - Seguridad vehicular
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.2
            url_launcher: ^6.2.5
            local_auth: ^2.1.8
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sosauto-apk
          path: build/app/outputs/flutter-apk/app-release.apk
