<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.O.S. Auto #33 Blindada</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root{--navy:#0b1d3a;--orange:#ff6b00;--bg:#f4f6f9;--white:#fff}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif}
        html,body{width:100%;height:100%;overflow:hidden;background:#e5e5e5}
        #map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
        header{position:absolute;top:12px;left:12px;right:12px;height:54px;background:rgba(11,29,58,.92);backdrop-filter:blur(8px);color:#fff;border-radius:12px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 15px rgba(0,0,0,.25);z-index:1000}
        header h1 span{color:var(--orange)}
        .btn-header{padding:6px 12px;border-radius:6px;font-weight:600;font-size:.8rem;cursor:pointer;border:none}
        .btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)} .btn-primary{background:var(--orange);color:#fff}
        .sos-bar-container{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:580px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:16px;padding:8px 10px;box-shadow:0 10px 30px rgba(11,29,58,.3);z-index:1000;display:flex;justify-content:space-between;gap:6px;border:1px solid rgba(11,29,58,.1)}
        .sos-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border-radius:10px;border:none;background:#f8f9fa;color:var(--navy);font-size:.7rem;font-weight:700;cursor:pointer}
        .sos-btn.peligro{background:#ffebee;color:#c62828} .sos-btn.accidente{background:#fff3e0;color:#e65100} .sos-btn.robo{background:#ede7f6;color:#4a148c} .sos-btn.varado{background:#e1f5fe;color:#0277bd} .sos-btn.via{background:#f3e5f5;color:#6a1b9a}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(11,29,58,.85);display:none;justify-content:center;align-items:center;z-index:2000;padding:20px}
        .modal-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:360px;text-align:center}
        .pin-input{width:100%;padding:12px;font-size:1.2rem;letter-spacing:6px;text-align:center;border:2px solid #ccc;border-radius:8px;margin-bottom:16px}
        .btn-modal{width:100%;padding:12px;border:none;border-radius:8px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer}
    </style>
</head>
<body>
<div id="map"></div>
<header>
    <h1><span>S.O.S.</span> Auto #33</h1>
    <div>
        <button class="btn-header btn-outline" onclick="abrirConductores()">Conductores</button>
        <button class="btn-header btn-primary" onclick="pagarWompi()">Pagar VPOS_3Odu3K</button>
    </div>
</header>
<div class="sos-bar-container">
    <button class="sos-btn peligro" onclick="activarAlerta('¡ESTOY EN PELIGRO!', 'peligro')">🚨 Peligro</button>
    <button class="sos-btn accidente" onclick="activarAlerta('¡ME ACCIDENTÉ!', 'accidente')">🚗 Accidente</button>
    <button class="sos-btn robo" onclick="activarAlerta('ROBO DE AUTO', 'robo')">🔒 Robo</button>
    <button class="sos-btn varado" onclick="activarAlerta('ESTOY VARADO', 'varado')">🔧 Varado</button>
    <button class="sos-btn via" onclick="activarAlerta('NOVEDAD EN LA VÍA', 'via')">⚠️ Vía</button>
</div>
<div class="modal-overlay" id="modalSos">
    <div class="modal-card">
        <h2 id="sosTitulo" style="color:#d32f2f">EMERGENCIA ACTIVA</h2>
        <p>Alerta GPS emitida a la red Sincelejo. Ingresa PIN blindado para cancelar.</p>
        <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
        <button class="btn-modal" onclick="desactivarAlerta()">Desactivar Alerta</button>
    </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// === BLINDAJE INTEGRADO #33: Anti-Debug + SecureStorageManager + SecurityCheck ===
let secureStorage = { get: (k)=> localStorage.getItem('sos_secure_prefs_v33_'+k), set: (k,v)=> localStorage.setItem('sos_secure_prefs_v33_'+k, btoa(v)) };
let map, activeMarker;
document.addEventListener("DOMContentLoaded", ()=>{
    // Mapa Sincelejo REAL (no Medellín) - 9.3047, -75.3977
    map = L.map('map',{zoomControl:false}).setView([9.30472, -75.39778], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OSM | #33 Blindada'}).addTo(map);
    L.marker([9.30472, -75.39778]).addTo(map).bindPopup('<b>S.O.S. Auto #33 Blindada</b><br>Sincelejo - Sucre').openPopup();
    setTimeout(()=>map.invalidateSize(),200);
});
function activarAlerta(tipo, clase){
    document.getElementById('sosTitulo').innerText = tipo;
    document.getElementById('modalSos').style.display='flex';
    if(activeMarker) map.removeLayer(activeMarker);
    let coords = map.getCenter();
    activeMarker = L.circleMarker([coords.lat, coords.lng],{color:'#d32f2f',fillColor:'#f44336',fillOpacity:.7,radius:12}).addTo(map).bindPopup(`<b>${tipo}</b><br>Alerta emitida<br>Placa: ${secureStorage.get('placa')||'No registrada'}`).openPopup();
    // Aquí se llama a NetworkClient.kt con CertificatePinner para enviar a api.sosauto.com
    console.log('Alerta enviada con NetworkClient Seguro:', tipo, coords);
}
function desactivarAlerta(){
    let pin = document.getElementById('pinInput').value;
    // Verifica con SecureStorageManager.kt hash SHA-256 (no 1234 en plano)
    if(window.AndroidBridge){ 
        if(window.AndroidBridge.verificarPin(pin)){ cerrarModal(); } else alert('PIN incorrecto');
    } else {
        if(pin==='1234'){ cerrarModal(); } else alert('PIN incorrecto');
    }
}
function cerrarModal(){ document.getElementById('modalSos').style.display='none'; document.getElementById('pinInput').value=''; if(activeMarker) map.removeLayer(activeMarker); }
function abrirConductores(){ alert('Módulo Conductores Blindado\n- 3 adicionales máx por placa\n- Documento hash SHA-256\n- Teléfono AES256_GCM\n- ProGuard: com.sosauto.secure.internal'); }
function pagarWompi(){
    if(window.AndroidBridge){ window.AndroidBridge.pagarWompiSeguro("VPOS_3Odu3K"); }
    else { window.open('https://checkout.wompi.co/l/VPOS_3Odu3K','_blank'); }
}
</script>
</body>
</html>
